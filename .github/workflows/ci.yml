name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar se existe index.html
        run: |
          if [ ! -f site/index.html ]; then
            echo "Arquivo index.html não encontrado!"
            exit 1
          fi

      - name: Gerar artefato
        uses: actions/upload-artifact@v4
        with:
          name: site-html
          path: site/
